name: Update lottery public data

on:
  workflow_dispatch:
  schedule:
    # UTC time. Beijing time = UTC + 8.
    # Beijing time 19:46, 20:06, 21:26, and next-day 02:36.
    - cron: "46 11 * * *"
    - cron: "6 12 * * *"
    - cron: "26 13 * * *"
    - cron: "36 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-lottery-public-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update public data
        env:
          JISU_APPKEY: ${{ secrets.JISU_APPKEY }}
        run: python scripts/update_public_data.py

      - name: Validate public data
        run: |
          python -m unittest discover -s tests
          python scripts/validate_public_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data
          git diff --cached --quiet || git commit -m "Update lottery public data"

      - name: Push changes
        run: git push
