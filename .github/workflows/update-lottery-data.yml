name: Update lottery V2 mirror

on:
  workflow_dispatch:
  schedule:
    # UTC time. Beijing time = UTC + 8.
    # Beijing time 08:14: final GitHub fallback and CloudBase mirror export.
    - cron: "14 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-lottery-public-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: cloudbase/package-lock.json

      - name: Install CloudBase package
        working-directory: cloudbase
        run: npm ci

      - name: Run final fallback for pending draws
        working-directory: cloudbase
        env:
          CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
          JISU_APPKEY: ${{ secrets.JISU_APPKEY }}
        run: npm run fallback:github

      - name: Export CloudBase V2 mirror
        working-directory: cloudbase
        env:
          CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: npm run export:public

      - name: Build draw calendar
        run: python scripts/build_draw_calendar.py

      - name: Validate V2 public data
        run: |
          python -m unittest discover -s tests
          python scripts/validate_public_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data
          git diff --cached --quiet || git commit -m "Update lottery V2 mirror"

      - name: Push changes
        run: git push
