name: Export confirmed next data once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-v2-once.yml"

permissions:
  contents: write

concurrency:
  group: export-slim-v2-once
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: cloudbase/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export confirmed v1 and v2 mirrors
        working-directory: cloudbase
        run: |
          npm ci
          npm test
          npm run export:public
      - name: Validate public data
        run: |
          python scripts/build_draw_calendar.py
          python -m unittest discover -s tests
          python scripts/validate_public_data.py
      - name: Commit exported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data
          git diff --cached --quiet || git commit -m "Publish confirmed next draw data"
          git push
