name: One-time CloudBase mirror export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-v2-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-cloudbase-mirror-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: cloudbase/package-lock.json

      - name: Install and test CloudBase package
        working-directory: cloudbase
        run: |
          npm ci
          npm test

      - name: Export CloudBase public mirror
        working-directory: cloudbase
        env:
          CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: npm run export:public

      - name: Build and validate public data
        run: |
          python scripts/build_draw_calendar.py
          python -m unittest discover -s tests
          python scripts/validate_public_data.py

      - name: Commit and push public mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_data
          git diff --cached --quiet || git commit -m "Refresh public data after class cleanup"
          git push
