name: One-time repair for 2026-09-20 prize data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-prizes-20260920.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      JISU_APPKEY: ${{ secrets.JISU_APPKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: cloudbase/package-lock.json

      - name: Re-fetch affected draws through the production handler
        working-directory: cloudbase
        run: |
          npm ci
          node --input-type=module <<'EOF'
          import { main } from "./src/handler.mjs";

          const result = await main({
            slot: "all_first",
            runner: "github_repair",
            target_date: "2026-09-20",
            lottery_types: ["ssq", "fc3d", "kl8", "pl3", "pl5", "qxc"],
          });
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok || result.results.some((item) => item.status !== "updated")) {
            process.exitCode = 1;
          }
          EOF
