name: Deploy CloudBase ingest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudbase/**"
      - "cloudbaserc.json"
      - ".github/workflows/deploy-cloudbase-ingest.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudbase-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_DISABLE_REPORT: "1"
      CLOUDBASE_ENV_ID: wenjin-cloudbase-d1empq882391ac1
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      JISU_APPKEY: ${{ secrets.JISU_APPKEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: cloudbase/package-lock.json

      - name: Test function package
        working-directory: cloudbase
        run: |
          npm ci
          npm test
          node -e "import('./src/handler.mjs').then(() => console.log('handler import ok'))"

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.3

      - name: Verify CLI syntax
        run: |
          tcb --version
          tcb login --help
          tcb fn deploy --help

      - name: Authenticate to the target environment
        run: |
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID" --yes
          tcb env use "$CLOUDBASE_ENV_ID" --yes

      - name: Deploy ingest function without triggers
        run: tcb fn deploy lottery-ingest --force --yes

      - name: Verify deployed function
        run: tcb fn detail lottery-ingest
